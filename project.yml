name: TailnetManager
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  TailnetManager:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - TailnetManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.tailnetmanager.app
        PRODUCT_NAME: TailnetManager
        GENERATE_INFOPLIST_FILE: YES
        # macOS uses the sandbox/network entitlements (required for the
        # notarized Developer ID build); iOS needs none of them, and applying
        # them there forces explicit provisioning that breaks device signing.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: TailnetManager/TailnetManager.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 28
        MARKETING_VERSION: "1.9.5"
        SWIFT_VERSION: "5.9"
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "Tailnet Manager"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Tailnet Manager asks Ghostty to open SSH sessions to your servers."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID unlocks Tailnet Manager with your saved API token."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
